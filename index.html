<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6ecd5">
  <meta name="description" content="桌游.club：选择狼人真言或血染钟楼，开始今晚的桌游。">
  <title>桌游.club · 选一场好游戏</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#f6ecd5;color:#362a23}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:#f6ecd5 url("assets/paper-background.png") repeat;background-size:1254px 1254px}
    main{width:min(100%,1488px);margin:auto;padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}
    header strong{font-size:20px;letter-spacing:.04em}
    .games{display:grid;gap:18px}
    .game{display:block;color:inherit;text-decoration:none;border-radius:18px;transition:transform .18s ease,box-shadow .18s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .art{display:block;overflow:hidden;border-radius:18px;background:#142139}
    .art img{display:block;width:100%;height:auto;aspect-ratio:4/3}
    .clocktower .art{background:#271324}

    .game:focus-visible{outline:3px solid #744b28;outline-offset:6px}
    @media(hover:hover){.game:hover{transform:translateY(-2px);box-shadow:0 8px 30px #0006}}
    footer{text-align:center;color:#6b5948;font-size:13px;line-height:1.8;margin-top:24px}
    @media(max-width:600px){
      main{padding:calc(24px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
      header{align-items:flex-start;flex-direction:column;gap:8px;padding:0 6px;margin-bottom:22px}
      .games{gap:22px}.game{overflow:hidden;border-radius:14px}
      .art,.clocktower .art{border-radius:14px}

    }
    @media(prefers-reduced-motion:reduce){.game{transition:none}}
  </style>
</head>
<body>
  <main>
    <header><strong>桌游.club</strong></header>
    <nav class="games" aria-label="选择游戏">
      <a class="game werewords" href="/werewords/" target="_top" aria-label="进入狼人真言">
        <span class="art"><img src="assets/werewords-cover-4x3.png" width="1448" height="1086" alt="狼人真言" fetchpriority="high"></span>
      </a>
      <a class="game clocktower" href="/blood-on-the-clocktower/" target="_top" aria-label="进入血染钟楼">
        <span class="art"><img src="assets/clocktower-cover-4x3.png" width="1448" height="1086" alt="血染钟楼"></span>
      </a>
    </nav>
    <footer>选好游戏，把手机带到桌边。</footer>
  </main>
</body>
</html>
